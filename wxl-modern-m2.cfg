# Native modern-M2 reader and renderer settings. 1 = enabled, 0 = disabled.

# Allow animation IDs above the Wrath AnimationData ceiling and publish the
# wxl.m2-animation service used by movement modules such as wxl-skyriding.
WXL_M2_EXTENDED_ANIMATIONS=1

# Enable the modern combiner compatibility patch.
WXL_M2_COMBINER_PATCH_ENABLED=1

# Route large M2 buffers through the core-owned arena, with VirtualAlloc fallback.
WXL_M2_VIRTUAL_ALLOC=1
WXL_M2_VIRTUAL_ALLOC_THRESHOLD_MB=1
